<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        
        <form id="registerForm" action="process_registration.php" method="POST">
            <div class="form-group">
                <label>Full Name *</label>
                <input type="text" id="fullname" name="fullname" required>
                <div class="error-message" id="nameError">Please enter your full name</div>
            </div>

            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" name="email" required>
                <div class="error-message" id="emailError">Please enter a valid email address</div>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" id="password" name="password" required>
                <div class="password-strength" id="strengthBar"></div>
                <div class="strength-text" id="strengthText"></div>
                <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
            </div>

            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <div class="error-message" id="confirmError">Passwords do not match</div>
            </div>

            <button type="submit">Register</button>
        </form>

        <div class="link">
            Already have an account? <a href="login.php">Login here</a>
        </div>
    </div>

    <script>
        // Form validation
        const form = document.getElementById('registerForm');
        const fullname = document.getElementById('fullname');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        // Real-time validation
        fullname.addEventListener('blur', function() {
            const error = document.getElementById('nameError');
            if(this.value.trim() === '') {
                error.style.display = 'block';
            } else {
                error.style.display = 'none';
            }
        });

        email.addEventListener('blur', function() {
            const error = document.getElementById('emailError');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailRegex.test(this.value)) {
                error.style.display = 'block';
            } else {
                error.style.display = 'none';
            }
        });

        // Password strength checker
        password.addEventListener('keyup', function() {
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            const value = this.value;
            
            if(value.length === 0) {
                strengthBar.className = 'password-strength';
                strengthText.textContent = '';
                return;
            }
            
            let strength = 'weak';
            if(value.length >= 8 && /[A-Z]/.test(value) && /[0-9]/.test(value)) {
                strength = 'strong';
                strengthText.textContent = '✓ Strong password';
                strengthText.style.color = '#27ae60';
            } else if(value.length >= 6) {
                strength = 'medium';
                strengthText.textContent = '⚠️ Medium password - add uppercase letters and numbers';
                strengthText.style.color = '#f39c12';
            } else {
                strengthText.textContent = '❌ Weak password - need at least 6 characters';
                strengthText.style.color = '#e74c3c';
            }
            
            strengthBar.className = `password-strength strength-${strength}`;
        });

        // Password match validation
        confirmPassword.addEventListener('keyup', function() {
            const error = document.getElementById('confirmError');
            if(this.value !== password.value) {
                error.style.display = 'block';
            } else {
                error.style.display = 'none';
            }
        });

        // Form submit validation
        form.addEventListener('submit', function(e) {
            let isValid = true;
            
            if(fullname.value.trim() === '') {
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if(!emailRegex.test(email.value)) {
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            if(password.value.length < 6) {
                document.getElementById('passwordError').style.display = 'block';
                isValid = false;
            }
            
            if(confirmPassword.value !== password.value) {
                document.getElementById('confirmError').style.display = 'block';
                isValid = false;
            }
            
            if(!isValid) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
